services:
  #web app mvp
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: local-dev-secret-change-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
    depends_on:
      - keycloak
      # Stretch goal vars — uncomment when implementing
      # DATABASE_URL: postgresql://postgres:password@db:5432/burger_rater
      # AWS_REGION: us-east-1
      # AWS_ACCESS_KEY_ID: ...
      # AWS_SECRET_ACCESS_KEY: ...
      # S3_BUCKET_NAME: burger-rater-images

  # =====================
  # Stretch goal: Postgres
  # =====================
  # db:
  #   image: postgres:16-alpine
  #   restart: always
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: burger_rater
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # =====================
  # Stretch goal: Keycloak
  # =====================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json

  # =====================
  # Local email catching (Mailpit)
  # =====================
  mailpit:
    image: axllent/mailpit
    restart: always
    ports:
      - "8025:8025"  # Web UI — view caught emails at http://localhost:8025
      - "1025:1025"  # SMTP — point Better Auth email at localhost:1025

