version: "3.9"

services:
  #web app mvp
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: local-dev-secret-change-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Stretch goal vars — uncomment when implementing
      # DATABASE_URL: postgresql://postgres:password@db:5432/burger_rater
      # AWS_REGION: us-east-1
      # AWS_ACCESS_KEY_ID: ...
      # AWS_SECRET_ACCESS_KEY: ...
      # S3_BUCKET_NAME: burger-rater-images

  # =====================
